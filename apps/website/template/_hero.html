<svg class="hero-art" viewBox="0 0 1200 600" role="img" aria-labelledby="hero-art-t" xmlns="http://www.w3.org/2000/svg">
  <title id="hero-art-t">{{t.hero_img_alt}}</title>
  <style>
    .hz-anim { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .hz-sweep { animation-name: hz-sweep; opacity: 0; }
    .hz-squeeze { animation-name: hz-squeeze; transform-box: fill-box; transform-origin: center; }
    .hz-drop { animation-name: hz-drop; opacity: 0; }
    .hz-d2 { animation-delay: .15s; } .hz-d3 { animation-delay: .3s; }
    .hz-card { animation-name: hz-card; opacity: 0; }
    .hz-b { opacity: 0; }
    .hz-b1 { animation-name: hz-b1; } .hz-b2 { animation-name: hz-b2; } .hz-b3 { animation-name: hz-b3; }
    @keyframes hz-sweep { 0%,5% { opacity: 0; transform: translateY(0); } 7% { opacity: 1; } 24% { opacity: 1; transform: translateY(208px); } 28%,100% { opacity: 0; transform: translateY(208px); } }
    @keyframes hz-squeeze { 0%,24% { transform: scale(1); } 28% { transform: scale(1.14, .84); } 33% { transform: scale(.95, 1.06); } 37%,100% { transform: scale(1); } }
    @keyframes hz-drop { 0%,27% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 38% { opacity: 0; transform: translate(120px, 0); } 100% { opacity: 0; } }
    @keyframes hz-card { 0%,33% { opacity: 0; transform: translateY(14px); } 38%,92% { opacity: 1; transform: none; } 98%,100% { opacity: 0; } }
    @keyframes hz-b1 { 0%,39% { opacity: 0; transform: translateX(-10px); } 43%,92% { opacity: 1; transform: none; } 98%,100% { opacity: 0; } }
    @keyframes hz-b2 { 0%,45% { opacity: 0; transform: translateX(-10px); } 49%,92% { opacity: 1; transform: none; } 98%,100% { opacity: 0; } }
    @keyframes hz-b3 { 0%,51% { opacity: 0; transform: translateX(-10px); } 55%,92% { opacity: 1; transform: none; } 98%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .hz-anim { animation: none !important; }
      .hz-card, .hz-b { opacity: 1; }
    }
  </style>
  <defs>
    <filter id="hz-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <path id="hz-dropshape" d="M14 0C14 0 3 -9 -3 -9C-8 -9 -12 -5 -12 0C-12 5 -8 9 -3 9C3 9 14 0 14 0Z"/>
  </defs>

  <!-- macchie di colore sullo sfondo -->
  <circle cx="1070" cy="130" r="110" fill="var(--primary)" opacity=".16"/>
  <circle cx="140" cy="490" r="105" fill="var(--primary)" opacity=".12"/>

  <!-- pagina lunga -->
  <g filter="url(#hz-shadow)">
    <rect x="60" y="60" width="500" height="480" rx="18" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  </g>
  <path d="M60 78A18 18 0 0 1 78 60H542A18 18 0 0 1 560 78V104H60Z" fill="var(--bg-2)"/>
  <circle cx="88" cy="82" r="6" fill="#ff5f57"/><circle cx="108" cy="82" r="6" fill="#febc2e"/><circle cx="128" cy="82" r="6" fill="#28c840"/>
  <rect x="156" y="71" width="370" height="22" rx="11" fill="var(--bg)"/>
  <rect x="96" y="132" width="290" height="18" rx="9" fill="var(--ink)" opacity=".75"/>
  <rect x="96" y="168" width="428" height="86" rx="10" fill="var(--line)"/>
  <g fill="var(--line)">
    <rect x="96" y="278" width="428" height="10" rx="5"/>
    <rect x="96" y="302" width="400" height="10" rx="5"/>
    <rect x="96" y="326" width="428" height="10" rx="5"/>
    <rect x="96" y="350" width="380" height="10" rx="5"/>
    <rect x="96" y="374" width="420" height="10" rx="5"/>
    <rect x="96" y="398" width="360" height="10" rx="5"/>
    <rect x="96" y="422" width="428" height="10" rx="5"/>
    <rect x="96" y="446" width="396" height="10" rx="5"/>
    <rect x="96" y="470" width="300" height="10" rx="5"/>
  </g>
  <rect class="hz-anim hz-sweep" x="88" y="272" width="444" height="22" rx="6" fill="var(--primary)" fill-opacity=".35"/>

  <!-- l'icona che spreme -->
  <g class="hz-anim hz-squeeze">
    <circle cx="640" cy="310" r="56" fill="#000" opacity=".06"/>
    <circle cx="640" cy="300" r="56" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
    <image href="/assets/icon-128.png" x="596" y="256" width="88" height="88"/>
  </g>
  <g fill="var(--primary)">
    <use href="#hz-dropshape" class="hz-anim hz-drop" x="660" y="270"/>
    <use href="#hz-dropshape" class="hz-anim hz-drop hz-d2" x="668" y="300"/>
    <use href="#hz-dropshape" class="hz-anim hz-drop hz-d3" x="660" y="330"/>
  </g>

  <!-- il riassunto: tre punti chiave -->
  <g class="hz-anim hz-card">
    <g filter="url(#hz-shadow)">
      <rect x="760" y="140" width="390" height="320" rx="20" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
    </g>
    <image href="/assets/icon-128.png" x="790" y="170" width="32" height="32"/>
    <rect x="836" y="180" width="150" height="14" rx="7" fill="var(--ink)" opacity=".75"/>
    <rect x="790" y="222" width="330" height="2" fill="var(--line)"/>
    <g class="hz-anim hz-b hz-b1">
      <circle cx="802" cy="264" r="9" fill="var(--primary)"/>
      <rect x="824" y="258" width="290" height="12" rx="6" fill="var(--ink-2)" opacity=".55"/>
      <rect x="824" y="280" width="200" height="10" rx="5" fill="var(--ink-2)" opacity=".3"/>
    </g>
    <g class="hz-anim hz-b hz-b2">
      <circle cx="802" cy="330" r="9" fill="var(--primary)"/>
      <rect x="824" y="324" width="270" height="12" rx="6" fill="var(--ink-2)" opacity=".55"/>
      <rect x="824" y="346" width="230" height="10" rx="5" fill="var(--ink-2)" opacity=".3"/>
    </g>
    <g class="hz-anim hz-b hz-b3">
      <circle cx="802" cy="396" r="9" fill="var(--primary)"/>
      <rect x="824" y="390" width="250" height="12" rx="6" fill="var(--ink-2)" opacity=".55"/>
      <rect x="824" y="412" width="160" height="10" rx="5" fill="var(--ink-2)" opacity=".3"/>
    </g>
  </g>
</svg>
