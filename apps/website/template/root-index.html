<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{displayName}}</title>
  <meta name="robots" content="noindex">
  <!-- Normally never served: the CloudFront function redirects "/" to the visitor's
       language. This file is the fallback if that function is missing. -->
  <meta http-equiv="refresh" content="0; url=/en/">
  <link rel="canonical" href="{{siteUrl}}/en/">
  {{!hreflang}}
</head>
<body>
  <p><a href="/en/">{{displayName}}</a></p>
  <p>{{!langLinksInline}}</p>
</body>
</html>
