<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDesc}}">
  {{!robots}}
  <link rel="canonical" href="{{canonical}}">
  {{!hreflang}}
  <link rel="icon" href="/assets/icon.svg?v={{assetV}}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-128.png?v={{assetV}}">
  <link rel="preload" href="/assets/site/fonts/switzer-600.woff2" as="font" type="font/woff2" crossorigin>
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{pageDesc}}">
  <meta property="og:image" content="{{siteUrl}}/assets/hero.png?v={{assetV}}">
  <meta property="og:url" content="{{canonical}}">
  <meta name="theme-color" content="{{primary}}">
  <style>
    /* Switzer (Fontshare, ITF Free Font License), served from this site: no request
       to a third-party font host. */
    @font-face { font-family: Switzer; src: url(/assets/site/fonts/switzer-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: Switzer; src: url(/assets/site/fonts/switzer-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: Switzer; src: url(/assets/site/fonts/switzer-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: Switzer; src: url(/assets/site/fonts/switzer-800.woff2) format("woff2"); font-weight: 800; font-display: swap; }
    :root {
      --primary: {{primary}};
      --primary-700: {{primary700}};
      --on-primary: {{onPrimary}};
      --ink: #16181c;
      --muted: #555b64;
      --bg: #ffffff;
      --tone: #f2f2ee;
      --pale: #fff4b8;
      --pith: #fff9dc;
      --font: Switzer, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --m: clamp(16px, 3vw, 44px);
      --gap: clamp(120px, 14vw, 200px);
      --step-small: 15px;
      --step-body: clamp(17px, 1rem + 0.25vw, 19px);
      --step-lead: clamp(20px, 1.1rem + 0.7vw, 26px);
      --step-head: clamp(36px, 1.3rem + 3.2vw, 68px);
      --step-display: clamp(52px, 6vw, 108px);
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: var(--font); font-size: var(--step-body); color: var(--ink); background: var(--bg); line-height: 1.5; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; }
    img, video { max-width: 100%; display: block; }
    h1, h2, h3 { font-weight: 600; letter-spacing: -0.04em; line-height: 0.95; margin: 0; text-wrap: balance; }
    p { margin: 0; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    ::selection { background: var(--primary); color: var(--on-primary); }
    .wrap { padding-inline: var(--m); }

    /* Bar: wordmark, three links, languages. Plain, on the page ground. */
    header.site { position: relative; z-index: 5; }
    header.site .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 80px; }
    .wordmark { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: var(--step-lead); letter-spacing: -0.03em; }
    .wordmark img { width: 32px; height: 32px; }
    nav.main { display: flex; gap: 28px; margin-left: auto; }
    nav.main a, .langs a { text-decoration: none; font-size: var(--step-small); font-weight: 500; }
    nav.main a:hover, .langs a:hover { text-decoration: underline; text-underline-offset: 4px; }
    .langs { display: flex; gap: 2px; }
    .langs a { padding: 8px; color: var(--muted); }
    .langs a[aria-current] { color: var(--ink); font-weight: 600; }

    /* One button shape on the whole page: a fully round pill, from the lemon's circle. */
    .cta { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 30px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: var(--step-body); text-decoration: none; border: 0; transition: transform .15s var(--ease), background .15s; }
    .cta:hover { transform: translateY(-2px); background: #000; }
    .cta:active { transform: translateY(1px) scale(.98); }
    .cta[aria-disabled] { cursor: default; background: var(--tone); color: var(--ink); transform: none; }
    .note { margin-top: 14px; font-size: var(--step-small); color: var(--muted); }

    /* The motif: the lemon in cross-section, drawn once as a symbol and used at every scale. */
    .lemon { display: block; }

    /* Hero */
    .hero { position: relative; min-height: min(100svh, 980px); display: grid; align-items: center; overflow: hidden; margin-top: -80px; padding-top: 80px; }
    .hero-disc { position: absolute; width: 120vh; height: 120vh; left: 84%; top: 55%; transform: translate(-50%, -50%); }
    .hero-disc svg { width: 100%; height: 100%; animation: turn 240s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    .hero-copy { position: relative; max-width: 58%; padding-block: 64px 96px; }
    .hero h1 { font-size: var(--step-display); max-width: 16ch; }
    .hero .sub { margin-top: 40px; font-size: var(--step-lead); line-height: 1.35; max-width: 30ch; }
    .hero .act { margin-top: 36px; }

    section.s { margin-top: var(--gap); }
    h2.head { font-size: var(--step-head); }

    /* Squeeze: the live thing. Two fields on one seam and one slider that drives both. */
    .sq { display: grid; grid-template-columns: 1fr 1fr; min-height: 88svh; }
    .sq-left { background: var(--tone); padding: clamp(32px, 4vw, 64px) var(--m); display: flex; flex-direction: column; gap: 28px; }
    .sq-left .lead { font-size: var(--step-body); max-width: 40ch; }
    .sq-clause { margin-top: auto; }
    .sq-clause .big { display: block; font-size: var(--step-display); font-weight: 600; letter-spacing: -0.04em; line-height: 0.95; font-variant-numeric: tabular-nums; }
    .sq-clause .small { display: block; margin-top: 16px; font-size: var(--step-lead); }
    .sq-right { background: var(--primary); display: grid; place-items: center; padding: 48px var(--m); }
    .sq-control { grid-column: 1 / -1; background: var(--ink); color: var(--bg); padding: 28px var(--m) 32px; }
    .sq-control label { display: block; font-size: var(--step-small); margin-bottom: 14px; color: #c9ccd1; }
    .sq-track { position: relative; height: 36px; display: flex; align-items: center; }
    .sq-track::before, .sq-track::after { content: ""; position: absolute; left: 0; height: 8px; border-radius: 999px; }
    .sq-track::after { right: 0; background: #3a3d43; }
    .sq-track::before { width: var(--fill, 0%); background: var(--primary); z-index: 1; }
    .sq-range { -webkit-appearance: none; appearance: none; position: relative; z-index: 2; width: 100%; height: 36px; margin: 0; background: transparent; outline-offset: 6px; }
    .sq-range::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%; background: var(--primary); border: 0; cursor: grab; }
    .sq-range::-moz-range-thumb { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); border: 0; cursor: grab; }
    .sq-stops { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 16px; font-size: var(--step-small); color: #9ea3ab; }
    .sq-stops button { all: unset; cursor: pointer; padding: 6px 0; }
    .sq-stops button:nth-child(2) { text-align: center; transform: translateX(-17%); }
    .sq-stops button:nth-child(3) { text-align: center; transform: translateX(17%); }
    .sq-stops button:last-child { text-align: right; }
    .sq-stops button[aria-pressed="true"] { color: var(--bg); font-weight: 600; }
    .sq-stops button:focus-visible { outline: 3px solid var(--primary); }

    /* The extension's own result card, at its real size. */
    .card-ui { width: min(460px, 100%); background: #fff; color: #333; border-radius: 12px; font-size: var(--step-small); line-height: 1.55; overflow: hidden; transition: opacity .2s; }
    .card-ui .bar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--ink); color: #fff; font-weight: 600; font-size: var(--step-small); }
    .card-ui .bar img { width: 22px; height: 22px; }
    .card-ui .body { padding: 18px; max-height: 52svh; overflow: auto; }
    .card-ui .t { font-weight: 600; color: var(--ink); }
    .card-ui .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
    .card-ui .meta span { background: var(--tone); border-radius: 999px; padding: 3px 10px; font-size: var(--step-small); color: var(--ink); }
    .card-ui .meta span.hi { background: var(--primary); }
    .card-ui ul { margin: 0; padding-left: 18px; }
    .card-ui li { margin: 0 0 8px; }
    .card-ui .src { font-size: var(--step-small); color: var(--muted); margin-top: 12px; }
    .card-ui.fade { opacity: .25; }

    /* Showcase: the content types, the picture on the lemon. */
    .show { position: relative; display: grid; grid-template-columns: 5fr 7fr; align-items: end; padding-block: 8vh 48px; }
    .show-list { list-style: none; margin: 0; padding: 0; position: relative; z-index: 2; }
    .show-list h2, .show-list button { font-size: clamp(30px, 2.9vw, 46px); line-height: 1.15; letter-spacing: -0.03em; font-weight: 600; }
    .show-list h2 { color: var(--muted); margin-bottom: 6px; }
    .show-list button { all: unset; cursor: pointer; display: inline-block; font-size: clamp(30px, 2.9vw, 46px); line-height: 1.2; letter-spacing: -0.03em; font-weight: 600; color: var(--muted); transition: color .2s; }
    .show-list button[aria-pressed="true"] { color: var(--ink); }
    .show-list button:hover { color: var(--ink); }
    .show-stage { position: relative; height: 64vh; min-height: 420px; }
    .show-disc { position: absolute; height: 100%; aspect-ratio: 1; left: 34%; top: 0; transform: translateX(-50%); }
    .show-disc svg { width: 100%; height: 100%; }
    .show-pic { position: absolute; left: 34%; top: -8%; height: 92%; aspect-ratio: 1; transform: translateX(-50%); margin: 0; display: grid; place-items: center; opacity: 0; transition: opacity 1.6s ease; mix-blend-mode: multiply; }
    .show-pic img { max-width: 100%; max-height: 100%; width: auto; height: auto; }
    .show-pic figcaption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .show-pic.on { opacity: 1; }
    .show-fact { position: absolute; right: var(--m); bottom: 15%; max-width: 26ch; font-size: var(--step-body); }
    .show-fact p + p { margin-top: 10px; font-size: var(--step-small); color: var(--muted); }

    /* Board: close-ups of the interface and pictures of the lemon's world. */
    .board { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 104px; gap: 8px; padding-inline: 10px; grid-template-areas:
      "h h h h h h v v v v v v" "h h h h h h v v v v v v"
      "l l l s s s v v v v v v" "l l l s s s v v v v v v"
      "l l l s s s t t t t t t" "l l l s s s t t t t t t"
      "g g g n n n b b b b b b" "g g g n n n b b b b b b"; }
    .tile { position: relative; overflow: hidden; border-radius: 0; background: var(--tone); }
    .tile .cap { position: absolute; left: 20px; bottom: 18px; right: 20px; z-index: 2; }
    .tile .cap b { display: block; font-size: var(--step-body); font-weight: 500; }
    .tile .cap span { display: block; font-size: var(--step-small); max-width: 42ch; }
    .tile.pic .cap { color: #fff; }
    .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; }
    .tile.pic::after { content: ""; position: absolute; inset: auto 0 0; height: 96px; background: rgba(0,0,0,.5); } /* neutral scrim under caption */
    .t-h { grid-area: h; background: var(--primary); padding: 24px; }
    .t-h h2 { font-size: var(--step-head); }
    .t-v { grid-area: v; }
    .t-l { grid-area: l; }
    .t-s { grid-area: s; background: var(--ink); color: var(--bg); }
    .t-t { grid-area: t; background: var(--pale); }
    .t-g { grid-area: g; }
    .t-n { grid-area: n; }
    .t-b { grid-area: b; }
    .t-g img { object-position: 60% 82%; }
    .t-b img { object-position: 50% 45%; }
    .zoom { position: absolute; font-size: 300%; line-height: 1.2; }
    .ui-select { position: absolute; top: 28px; left: 28px; font-size: var(--step-small); }
    .ui-select div { display: inline-flex; align-items: center; gap: .5em; padding: .5em 1em; border-radius: 999px; background: #fff; font-size: 260%; font-weight: 600; white-space: nowrap; }
    .ui-btn { position: absolute; left: 20px; right: 20px; top: 28px; width: fit-content; max-width: calc(100% - 40px); font-size: var(--step-lead); background: var(--primary); color: var(--on-primary); border-radius: 999px; padding: .5em 1em; font-weight: 600; transition: transform .2s var(--ease); }
    .t-s:hover .ui-btn { transform: translateX(-.2em); }
    .ui-fig { position: absolute; top: 14px; left: 20px; font-size: var(--step-display); font-weight: 600; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .t-n .ui-fig { font-size: var(--step-head); }
    .tile.ink-cap .cap { color: var(--bg); }

    /* Pricing: one price, very large. */
    .price { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 24px; min-height: 80svh; align-items: center; }
    .price-intro { grid-column: 1 / 5; align-self: start; padding-top: 24px; }
    .price-intro h2 { font-size: var(--step-lead); letter-spacing: -0.03em; line-height: 1.1; }
    .price-intro p { margin-top: 16px; font-size: var(--step-body); max-width: 34ch; }
    .price-fig { grid-column: 6 / 13; position: relative; }
    .price-num { position: relative; font-size: clamp(110px, 15vw, 240px); font-weight: 600; letter-spacing: -0.06em; line-height: 0.85; white-space: nowrap; }
    .price-num small { font-size: var(--step-body); letter-spacing: 0; font-weight: 500; margin-left: 12px; }
    .price-disc { position: absolute; width: clamp(120px, 14vw, 220px); aspect-ratio: 1; right: 4%; top: -14%; }
    .price-disc svg { width: 100%; height: 100%; }
    .price-alt { margin-top: 20px; font-size: var(--step-body); }
    .price-incl { list-style: none; margin: 32px 0 32px; padding: 0; font-size: var(--step-body); display: grid; gap: 8px; }
    .price-more { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-top: 72px; }
    .price-more > div { padding: 28px 0 0; }
    .price-more h3 { font-size: var(--step-lead); letter-spacing: -0.03em; }
    .price-more p { margin-top: 10px; }
    .price-more .p { font-size: var(--step-lead); font-weight: 600; letter-spacing: -0.03em; margin-top: 14px; }
    .price-more a { font-weight: 600; }

    /* FAQ: index cards in a drawer, one open at a time. */
    .faq { display: grid; grid-template-columns: repeat(12, 1fr); }
    .faq > * { grid-column: 3 / 11; }
    .faq h2 { margin-bottom: 72px; }
    .drawer details { position: relative; padding: 0 28px; margin-top: 40px; }
    .drawer details:nth-child(3n+1) { background: var(--pale); }
    .drawer details:nth-child(3n+2) { background: var(--tone); }
    .drawer details:nth-child(3n) { background: var(--primary); }
    .drawer details:nth-child(3n+1) .tab { background: var(--pale); } .drawer details:nth-child(3n+2) .tab { background: var(--tone); } .drawer details:nth-child(3n) .tab { background: var(--primary); }
    .drawer .tab { position: absolute; top: -40px; height: 40px; width: 200px; display: flex; align-items: center; padding: 0 20px; font-size: var(--step-small); background: inherit; border-radius: 14px 14px 0 0; }
    .drawer details:nth-child(1) .tab { left: 0; } .drawer details:nth-child(2) .tab { left: 130px; } .drawer details:nth-child(3) .tab { left: 260px; }
    .drawer details:nth-child(4) .tab { left: 390px; } .drawer details:nth-child(5) .tab { left: 520px; } .drawer details:nth-child(6) .tab { left: 650px; }
    .drawer summary { background: inherit; list-style: none; cursor: pointer; font-size: var(--step-lead); font-weight: 500; min-height: 56px; display: flex; align-items: center; padding-block: 8px; }
    .drawer summary::-webkit-details-marker { display: none; }
    .drawer details p { font-size: var(--step-body); max-width: 50ch; padding-bottom: 28px; }
    .drawer details[open] summary { font-weight: 600; }
    .faq .more { margin-top: 40px; font-weight: 600; }

    /* Closing band: the whole band is the action. */
    .band { position: relative; display: block; min-height: 60svh; background: var(--primary); color: var(--on-primary); text-decoration: none; border-radius: 48px 48px 0 0; overflow: hidden; padding: 28px var(--m); transition: none; }
    a.band:hover, a.band:focus-visible { background: var(--ink); color: var(--primary); transform: none; }
    .band-line { display: block; font-size: var(--step-lead); max-width: 26ch; }
    .band-arrow { position: absolute; right: var(--m); top: 28px; width: 48px; height: 48px; }
    .band-word { position: absolute; left: var(--m); right: var(--m); bottom: 24px; font-size: clamp(88px, 24vw, 420px); font-weight: 800; letter-spacing: -0.06em; line-height: 0.8; white-space: nowrap; }

    /* Footer: the lemon, built large, then plain links. */
    footer.site { background: var(--ink); color: #e8e9eb; padding: 56px var(--m) 40px; font-size: var(--step-small); }
    .foot-mark { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 4px; height: 34svh; min-height: 200px; }
    .foot-mark svg { height: 100%; width: auto; max-width: 100%; }
    .foot-mark .word { font-size: clamp(48px, 7.4vw, 150px); font-weight: 800; letter-spacing: -0.06em; line-height: 0.8; color: var(--primary); white-space: nowrap; overflow: hidden; }
    .foot-cols { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; margin-top: 56px; }
    .foot-cols nav { grid-column: span 2; display: grid; align-content: start; gap: 8px; }
    .foot-cols .addr { grid-column: 9 / 13; display: grid; gap: 8px; align-content: start; }
    .foot-cols a { text-decoration: none; color: #e8e9eb; }
    .foot-cols a:hover { color: var(--primary); }
    .foot-credits { margin-top: 48px; font-size: var(--step-small); color: #b9bcc2; max-width: 75ch; }
    .foot-credits a { color: #b9bcc2; }
    .foot-last { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 32px; font-size: var(--step-small); color: #b9bcc2; }
    .foot-last .cta { min-height: 44px; padding: 0 20px; font-size: var(--step-small); background: var(--primary); color: var(--on-primary); }

    /* Inner pages (FAQ, status pages) */
    .page { padding-block: 72px 120px; }
    .page h1 { font-size: var(--step-head); margin-bottom: 48px; }
    .page details { background: var(--tone); margin-bottom: 8px; padding: 0 24px; }
    .page summary { cursor: pointer; font-weight: 600; font-size: var(--step-body); list-style: none; padding: 20px 0; }
    .page summary::-webkit-details-marker { display: none; }
    .page details p { padding-bottom: 22px; max-width: 65ch; }
    .page .act { margin-top: 48px; }
    .page, .status { position: relative; overflow: hidden; isolation: isolate; }
    .page-disc { position: absolute; width: 70vh; height: 70vh; right: -24vh; top: -18vh; z-index: -1; }
    .page-disc svg { width: 100%; height: 100%; }
    .page > *:not(.page-disc) { max-width: min(860px, 62vw); }
    .status { min-height: 70svh; display: grid; align-content: center; justify-items: start; gap: 24px; }
    .login-form { display: grid; gap: 8px; width: min(100%, 420px); }
.login-form label { font-size: var(--step-small); font-weight: 600; margin-top: 8px; }
.login-form input { min-height: 52px; padding: 0 18px; border: 0; border-radius: 14px; background: var(--tone); color: var(--ink); font: inherit; font-size: var(--step-body); }
.login-form input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.login-form[hidden], .login-error[hidden], #login-noext[hidden] { display: none; }
.login-error { padding: 12px 16px; border-radius: 12px; background: var(--pale); font-size: var(--step-small); }
.login-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.login-actions .cta { width: 100%; padding: 0 16px; }
.cta.cta-alt { background: var(--tone); color: var(--ink); }
.status h1 { font-size: var(--step-head); }
    .status p { font-size: var(--step-lead); max-width: 40ch; }

    /* Entrances: heading, text, picture, 70 ms apart. Content stays visible without script. */
    .js [data-in] > * { opacity: 0; transform: translateY(24px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
    .js [data-in].in > * { opacity: 1; transform: none; }
    .js [data-in].in > *:nth-child(2) { transition-delay: 70ms; } .js [data-in].in > *:nth-child(3) { transition-delay: 140ms; }
    .js [data-in].in > *:nth-child(4) { transition-delay: 210ms; } .js [data-in].in > *:nth-child(5) { transition-delay: 280ms; }
    .js [data-in].in > *:nth-child(6) { transition-delay: 350ms; } .js [data-in].in > *:nth-child(n+7) { transition-delay: 420ms; }

    @media (max-width: 900px) {
      nav.main { display: none; }
      .wordmark .text { display: none; }
      .hero { min-height: 100svh; align-items: start; }
      .hero-disc { width: 130vw; height: 130vw; left: 50%; top: calc(56svh + 65vw); }
      .hero-copy { max-width: none; padding-top: 12svh; }
      .hero h1 { font-size: clamp(38px, 10vw, 72px); }
      .hero .sub { margin-top: 32px; font-size: var(--step-body); }
      .sq { grid-template-columns: 1fr; }
      .sq-right { order: -1; min-height: 46svh; }
      .sq-left { order: 1; }
      .sq-control { order: 0; }
