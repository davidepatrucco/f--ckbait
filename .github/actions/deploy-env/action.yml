name: Deploy backend env
description: Deploy the SAM stack for one environment and run smoke/E2E against it.

inputs:
  environment:
    description: Environment name (dev|staging|prod) passed to the SAM template.
    required: true
  stack-name:
    description: CloudFormation stack name.
    required: true
  allowed-origins:
    description: Comma-separated CORS origins for this environment.
    required: true
  role-arn:
    description: IAM role ARN assumed via GitHub OIDC.
    required: true
  region:
    description: AWS region.
    required: false
    default: eu-west-1

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
    - uses: aws-actions/setup-sam@v2
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Validate template
      shell: bash
      run: sam validate --template-file infra/sam-template-simple.yaml
    - name: Build backend
      shell: bash
      run: sam build --template-file infra/sam-template-simple.yaml
    - name: Resolve ffmpeg layer
      id: ffmpeg
      shell: bash
      run: |
        # Ultima versione pubblicata da infra/build-ffmpeg-layer.sh. Se il layer non
        # esiste si passa una stringa vuota: il worker viene deployato senza ffmpeg e
        # la trascrizione asincrona risponde ASYNC_UNAVAILABLE (degrado, non errore).
        arn=$(aws lambda list-layer-versions \
          --layer-name reading-intelligence-ffmpeg \
          --region "${{ inputs.region }}" \
          --query 'LayerVersions[0].LayerVersionArn' \
          --output text 2>/dev/null || echo '')
        if [ "$arn" = "None" ] || [ -z "$arn" ]; then
          echo "layer ffmpeg non trovato: trascrizione asincrona disabilitata"
          arn=''
        else
          echo "layer ffmpeg: $arn"
        fi
        echo "arn=$arn" >> "$GITHUB_OUTPUT"
    - name: Deploy ${{ inputs.environment }}
      shell: bash
      run: >-
        sam deploy
        --template-file .aws-sam/build/template.yaml
        --stack-name "${{ inputs.stack-name }}"
        --region "${{ inputs.region }}"
        --resolve-s3
        --s3-prefix "${{ inputs.stack-name }}"
        --capabilities CAPABILITY_IAM
        --no-confirm-changeset
        --no-fail-on-empty-changeset
        --parameter-overrides
        "Environment=${{ inputs.environment }}"
        "AllowedOrigins=${{ inputs.allowed-origins }}"
        "FfmpegLayerArn=${{ steps.ffmpeg.outputs.arn }}"
    - name: Resolve API URL
      id: url
      shell: bash
      run: |
        url=$(aws cloudformation describe-stacks \
          --stack-name "${{ inputs.stack-name }}" \
          --region "${{ inputs.region }}" \
          --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
          --output text)
        echo "api_url=$url" >> "$GITHUB_OUTPUT"
        echo "API (${{ inputs.environment }}): $url"
    - name: Smoke / E2E
      shell: bash
      run: node scripts/smoke-e2e.mjs "${{ steps.url.outputs.api_url }}"
