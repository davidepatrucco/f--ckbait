name: Deploy site (lemonsqueezer.app)

# Ogni push su main che tocca il sito: test -> stack del sito (CloudFormation, no-op se
# invariato) -> genera le pagine -> pubblica su S3 + invalidazione CloudFront -> verifica.
# Bucket e distribuzione si leggono dagli output dello stack: nessun valore cablato.
# Il parametro BasicAuth (password del sito) non viene passato: CloudFormation tiene il
# valore precedente.

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'legal/**'
      - 'brands/lemonsqueezer/**'
      - 'store/lemonsqueezer/screenshots/**'
      - 'infra/site.yaml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: site-lemonsqueezer
  cancel-in-progress: false

env:
  BRAND: lemonsqueezer
  STACK: site-lemonsqueezer
  REGION: us-east-1

jobs:
  test:
    name: Test (generatore sito incluso)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: Pubblica + verifica
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Stack del sito
        run: |
          aws cloudformation deploy --region "$REGION" --stack-name "$STACK" \
            --template-file infra/site.yaml --no-fail-on-empty-changeset \
            --parameter-overrides DomainName=lemonsqueezer.app HostedZoneId=Z03400532R9K5SGPFIF7U

      - name: Output dello stack
        id: stack
        run: |
          out() { aws cloudformation describe-stacks --region "$REGION" --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(out BucketName)" >> "$GITHUB_OUTPUT"
          echo "dist=$(out DistributionId)" >> "$GITHUB_OUTPUT"
          echo "url=$(out SiteUrl)" >> "$GITHUB_OUTPUT"

      - name: Genera
        run: node apps/website/generate-site.mjs "$BRAND"

      - name: Pubblica
        run: bash apps/website/publish.sh "$BRAND" "${{ steps.stack.outputs.bucket }}" "${{ steps.stack.outputs.dist }}"

      - name: Verifica
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          DIST: ${{ steps.stack.outputs.dist }}
          URL: ${{ steps.stack.outputs.url }}
        run: |
          set -euo pipefail
          # 1. Quello che sta nel bucket e' quello appena generato.
          for f in it/index.html en/index.html privacy-policy.html assets/icon-128.png; do
            aws s3 cp "s3://$BUCKET/$f" - | cmp - "apps/website/dist/$BRAND/$f"
          done
          # 2. La cache di CloudFront e' stata svuotata.
          inv=$(aws cloudfront list-invalidations --distribution-id "$DIST" --query 'InvalidationList.Items[0].Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$inv"
          # 3. Il sito risponde: pagine legali e immagini sempre pubbliche; la home e'
          #    200 se il sito e' aperto, 401 se e' dietro password.
          code() { curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$URL$1"; }
          for p in /privacy-policy.html /terms.html /assets/icon-128.png; do
            c=$(code "$p"); echo "$p $c"; [ "$c" = 200 ]
          done
          c=$(code /it/); echo "/it/ $c"; [ "$c" = 200 ] || [ "$c" = 401 ]
          curl -s "$URL/privacy-policy.html" | cmp - "apps/website/dist/$BRAND/privacy-policy.html"
