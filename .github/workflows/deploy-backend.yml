name: Deploy backend (dev → staging)

# Ogni push su main che tocca il backend: test → dev → smoke → staging → smoke/E2E.
# PROD è DISACCOPPIATO: deploy manuale via workflow "Deploy backend PROD"
# (.github/workflows/deploy-prod.yml). Così un push su main non resta mai bloccato
# a un gate prod e la coda non si accumula. dev usa var repo; staging usa var per-env.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'scripts/smoke-e2e.mjs'
      - '.github/workflows/deploy-backend.yml'
      - '.github/actions/deploy-env/**'
  workflow_dispatch:

# OIDC: credenziali AWS short-lived, nessuna access key in GitHub.
permissions:
  contents: read
  id-token: write

# Una pipeline alla volta; le run si accodano (no cancellazione a metà deploy).
concurrency:
  group: lemonsqueezer-deploy-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy-dev:
    name: Deploy + smoke (dev)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-env
        with:
          environment: dev
          stack-name: lemonsqueezer-dev
          allowed-origins: ${{ vars.ALLOWED_ORIGINS }}
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

  deploy-staging:
    name: Deploy + smoke/E2E (staging)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-env
        with:
          environment: staging
          stack-name: lemonsqueezer-staging
          allowed-origins: ${{ vars.ALLOWED_ORIGINS }}
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}
