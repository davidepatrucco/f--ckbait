  <rect x="22" y="16" width="84" height="96" rx="10" fill="#F2F4F7"/>
  <g stroke="#111827" stroke-width="9" stroke-linecap="round">
    <line x1="38" y1="44" x2="90" y2="44"/>
    <line x1="38" y1="64" x2="90" y2="64"/>
    <line x1="38" y1="84" x2="70" y2="84"/>
  </g>
</svg>
