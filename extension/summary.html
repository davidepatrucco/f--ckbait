<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="summarypage_title">Riassunto</title>
<style>
  @font-face { font-family: Switzer; src: url(fonts/switzer-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Switzer; src: url(fonts/switzer-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: Switzer; src: url(fonts/switzer-800.woff2) format("woff2"); font-weight: 800; font-display: swap; }
  :root { --p: #FFD400; --ink: #16181c; --muted: #555b64; --tone: #f2f2ee; --pale: #fff4b8; --m: clamp(16px, 3vw, 44px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 18px/1.55 Switzer, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 20px var(--m); font-weight: 800; font-size: 20px; letter-spacing: -0.03em; }
  .bar svg { width: 30px; height: 30px; }
  .wrap { max-width: 820px; padding: 32px var(--m) 120px; }
  h1 { font-size: clamp(32px, 4vw, 52px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; margin: 0; text-wrap: balance; }
  .src { margin-top: 12px; font-size: 15px; }
  .src a { color: var(--muted); text-decoration: none; }
  .src a:hover { color: var(--ink); text-decoration: underline; }
  .saved { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 32px 0 0; padding: 20px 24px; background: var(--p); }
  .saved b { font-size: 40px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .saved span { font-size: 15px; }
  .content { margin-top: 32px; white-space: pre-line; }
  ul.points { list-style: none; margin: 36px 0 0; padding: 0; display: grid; gap: 18px; max-width: 62ch; }
  ul.points li { position: relative; padding-left: 30px; }
  ul.points li::before { content: ""; position: absolute; left: 2px; top: .45em; width: 14px; height: 14px; border-radius: 50%; background: var(--p); }
  .loading, .error { display: grid; justify-items: start; gap: 16px; padding: 40px 0; font-size: 20px; }
  .error { background: var(--pale); padding: 24px; }
  .spin { width: 64px; height: 64px; animation: s 1.4s cubic-bezier(.5,.1,.5,.9) infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h4 { margin: 28px 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  ul { margin: 0 0 8px; padding-left: 22px; } li { margin: 6px 0; }
  .note { margin: 16px 0; padding: 12px 16px; background: var(--pale); font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 6s; } }
</style>
</head>
<body>
  <header class="bar"><svg viewBox="-100 -100 200 200" aria-hidden="true"><g id="sl"><circle r="100" style="fill:var(--p)"/><circle r="90" fill="#fff9dc"/><g style="fill:var(--p)"><path id="sg" d="M0 -8 L-21 -80 A84 84 0 0 1 21 -80 Z"/><use href="#sg" transform="rotate(36)"/><use href="#sg" transform="rotate(72)"/><use href="#sg" transform="rotate(108)"/><use href="#sg" transform="rotate(144)"/><use href="#sg" transform="rotate(180)"/><use href="#sg" transform="rotate(216)"/><use href="#sg" transform="rotate(252)"/><use href="#sg" transform="rotate(288)"/><use href="#sg" transform="rotate(324)"/></g></g></svg><span id="brand" data-i18n="summarypage_title">Riassunto</span></header>
  <main class="wrap">
    <div id="root"><div class="loading"><svg class="spin" viewBox="-100 -100 200 200" aria-hidden="true"><use href="#sl"/></svg><span data-i18n="summarypage_loading">Riassunto in corso…</span></div></div>
  </main>
  <script src="brand-config.js"></script>
  <script src="summary.js"></script>
</body>
</html>
