<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riassunto</title>
<style>
  :root { --p:#FFD400; --ink:#0D1117; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f6f7f9; color:#1a2230; font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:28px 20px 60px; }
  .brand { font-weight:800; font-size:18px; margin-bottom:18px; }
  .card { background:#fff; border:1px solid #e6e8ec; border-radius:12px; padding:22px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
  h1 { font-size:20px; margin:0 0 6px; line-height:1.3; }
  .src { font-size:12px; }
  .src a { color:#2f6fed; word-break:break-all; }
  .content { margin-top:16px; white-space:pre-wrap; }
  .loading, .error { text-align:center; padding:40px 10px; color:#5a6473; }
  .spin { width:34px;height:34px;border:4px solid #eee;border-top-color:var(--p);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px; }
  @keyframes s { to { transform:rotate(360deg); } }
  h4 { margin:16px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:#8a94a3; }
  ul { margin:0 0 8px; padding-left:20px; } li { margin:5px 0; }
  .note { margin:8px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand" id="brand">Riassunto</div>
    <div class="card">
      <div id="root"><div class="loading"><div class="spin"></div>Riassunto in corso…</div></div>
    </div>
  </div>
  <script src="brand-config.js"></script>
  <script src="summary.js"></script>
</body>
</html>
