AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'LemonSqueezer - Chrome extension backend'

Parameters:
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: ['dev', 'staging', 'prod']
    Description: Environment name
  AllowedOrigins:
    Type: String
    Default: ''
    Description: Comma-separated browser origins permitted by Lambda CORS.
  SummaryModel:
    Type: String
    Default: 'gpt-5-nano'
    Description: OpenAI model used for summaries. Changing it creates a separate cache namespace.
  SummaryMaxWords:
    Type: Number
    Default: 800
    MinValue: 100
    MaxValue: 4000
    Description: Hard upper bound for a generated summary, regardless of source length.

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PARAMETER_STORE_PREFIX: !Sub '/lemonsqueezer/${Environment}'
        USERS_TABLE_NAME: !Ref UsersTable
        SUBSCRIPTIONS_TABLE_NAME: !Ref SubscriptionsTable
        PAYMENTS_TABLE_NAME: !Ref PaymentsTable
        CACHE_TABLE_NAME: !Ref SummaryCacheTable
        RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
        ANALYTICS_TABLE_NAME: !Ref AnalyticsTable
        ALLOWED_ORIGINS: !Ref AllowedOrigins

Resources:
  # API Gateway
  LemonSqueezerAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment

  # Lambda Function
  SummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lemonsqueezer-summarize-${Environment}'
      CodeUri: ../backend/
      Handler: lambda/handler.handler
      Description: 'Main Lambda function for page summarization'
      Environment:
        Variables:
          SUMMARY_MODEL: !Ref SummaryModel
          SUMMARY_MAX_WORDS: !Ref SummaryMaxWords
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SummaryCacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalyticsTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub 'lemonsqueezer/${Environment}/*'
      Events:
        SummarizeAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /summarize
            Method: POST
        SummarizeUrlAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /summarize-url
            Method: POST
        AuthGoogleAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /auth/google
            Method: POST
        AuthVerifyAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /auth/verify
            Method: POST
        PaymentsCreateCheckoutAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /payments/create-checkout
            Method: POST
        PaymentsVerifyCheckoutAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /payments/verify-checkout
            Method: POST
        HealthAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /health
            Method: GET
        ProxyAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /{proxy+}
            Method: ANY

  # Lambda Function URL for Stripe Webhook (bypass API Gateway)
  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lemonsqueezer-stripe-webhook-${Environment}'
      CodeUri: ../backend/
      Handler: lambda/handler.stripeWebhookHandler
      Description: 'Stripe webhook handler with raw body'
      Timeout: 60
      MemorySize: 512
      Runtime: nodejs20.x
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          PARAMETER_STORE_PREFIX: !Sub '/lemonsqueezer/${Environment}'
          USERS_TABLE_NAME: !Ref UsersTable
          SUBSCRIPTIONS_TABLE_NAME: !Ref SubscriptionsTable
          PAYMENTS_TABLE_NAME: !Ref PaymentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentSessionsTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub 'lemonsqueezer/${Environment}/*'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  # CloudWatch Log Group for Lambda
  SummarizeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/lemonsqueezer-summarize-${Environment}'
      RetentionInDays: 14

  StripeWebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/lemonsqueezer-stripe-webhook-${Environment}'
      RetentionInDays: 14

  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-users-${Environment}'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-subscriptions-${Environment}'
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: subscriptionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: subscriptionId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-payments-${Environment}'
      AttributeDefinitions:
        - AttributeName: paymentId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: paymentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserPaymentsIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  PaymentSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-payments-${Environment}_sessions'
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  # Legacy cache retained during the key-schema migration.
  CacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'lemonsqueezer-cache-${Environment}'
      AttributeDefinitions:
        - AttributeName: url
          AttributeType: S
      KeySchema:
        - AttributeName: url
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  # V2: shared content-hash cache.
  SummaryCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-summary-cache-${Environment}'
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-rate-limit-${Environment}'
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: resetTime
        Enabled: true
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-analytics-${Environment}'
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TimestampIndex
          KeySchema:
            - AttributeName: timestamp
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserEventsIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

Outputs:
  ApiUrl:
    Description: 'API Gateway endpoint URL'
    Value: !Sub 'https://${LemonSqueezerAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  StripeWebhookUrl:
    Description: 'Stripe Webhook Function URL (use this in Stripe Dashboard)'
    Value: !GetAtt StripeWebhookFunctionUrl.FunctionUrl
    Export:
      Name: !Sub '${AWS::StackName}-StripeWebhookUrl'

  FunctionName:
    Description: 'Lambda Function Name'
    Value: !Ref SummarizeFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'
