AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'LemonSqueezer - Infrastructure for TL;DR extension backend'

Parameters:
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: ['dev', 'staging', 'prod']
    Description: Environment name

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        RATE_LIMIT_TABLE: !Ref RateLimitTable
        USERS_TABLE_NAME: !Ref UsersTable
        ANALYTICS_TABLE_NAME: !Ref AnalyticsTable
        CACHE_TABLE_NAME: !Ref CacheTable
        PAYMENTS_TABLE_NAME: !Ref PaymentsTable
        # Secrets vengono caricati da Parameter Store nel codice
        PARAMETER_STORE_PREFIX: !Sub '/lemonsqueezer/${Environment}'

Resources:
  # API Gateway
  LemonSqueezerAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,x-api-key'"
        AllowOrigin: "'*'"

  # Usage Plan per rate limiting
  LemonSqueezerUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub 'lemonsqueezer-usage-plan-${Environment}'
      Description: !Sub 'Usage plan for LemonSqueezer ${Environment}'
      ApiStages:
        - ApiId: !Ref LemonSqueezerAPI
          Stage: !Ref Environment
      Quota:
        Limit: 10000
        Period: MONTH
      Throttle:
        RateLimit: 10
        BurstLimit: 20

  # Lambda Function
  SummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lemonsqueezer-summarize-${Environment}'
      CodeUri: ../backend/
      Handler: lambda/handler.handler
      Description: 'Main Lambda function for page summarization'
      Events:
        SummarizeAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /summarize
            Method: POST
        SummarizeUrlAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /summarize-url
            Method: POST
        AuthLoginAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /auth/login
            Method: POST
        AuthVerifyAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /auth/verify
            Method: POST
        UserStatsAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /analytics/user-stats
            Method: GET
        GlobalStatsAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /analytics/global-stats
            Method: GET
        TrendingDomainsAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /analytics/trending-domains
            Method: GET
        CacheStatsAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /cache/stats
            Method: GET
        CleanCacheAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /cache/clean
            Method: POST
        CreateCheckoutAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /payments/create-checkout
            Method: POST
        VerifyCheckoutAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /payments/verify-checkout
            Method: POST
        StripeWebhookAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /payments/webhook
            Method: POST
        UserSubscriptionAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /payments/subscription
            Method: GET
        CancelSubscriptionAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /payments/cancel
            Method: POST
        HealthAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /health
            Method: GET
        OptionsAPI:
          Type: Api
          Properties:
            RestApiId: !Ref LemonSqueezerAPI
            Path: /{proxy+}
            Method: OPTIONS
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalyticsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lemonsqueezer/${Environment}/*'

  # DynamoDB Tables
  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-payments-${Environment}'
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: LemonSqueezer

  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-cache-${Environment}'
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: LemonSqueezer

  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-analytics-${Environment}'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: date_partition
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: DateIndex
          KeySchema:
            - AttributeName: date_partition
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: LemonSqueezer

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-users-${Environment}'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: LemonSqueezer

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-subscriptions-${Environment}'
      AttributeDefinitions:
        - AttributeName: apiKey
          AttributeType: S
      KeySchema:
        - AttributeName: apiKey
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: LemonSqueezer

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'lemonsqueezer-rate-limits-${Environment}'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: LemonSqueezer

  # API Key for private use
  LemonSqueezerApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub 'lemonsqueezer-private-key-${Environment}'
      Description: 'Private API key for LemonSqueezer extension'
      Enabled: true

  # Usage Plan Key Association
  LemonSqueezerUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref LemonSqueezerApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref LemonSqueezerUsagePlan

  # CloudWatch Log Group for Lambda
  SummarizeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/lemonsqueezer-summarize-${Environment}'
      RetentionInDays: 14

  # CloudWatch Alarms
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'LemonSqueezer-${Environment}-Errors'
      AlarmDescription: 'Lambda function errors'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SummarizeFunction

  DurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'LemonSqueezer-${Environment}-Duration'
      AlarmDescription: 'Lambda function duration'
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 25000  # 25 seconds
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SummarizeFunction

Outputs:
  ApiUrl:
    Description: 'API Gateway endpoint URL'
    Value: !Sub 'https://${LemonSqueezerAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ApiKey:
    Description: 'API Key for private access'
    Value: !Ref LemonSqueezerApiKey
    Export:
      Name: !Sub '${AWS::StackName}-ApiKey'

  PaymentsTableName:
    Description: 'DynamoDB Payments Table Name'
    Value: !Ref PaymentsTable
    Export:
      Name: !Sub '${AWS::StackName}-PaymentsTable'

  CacheTableName:
    Description: 'DynamoDB Cache Table Name'
    Value: !Ref CacheTable
    Export:
      Name: !Sub '${AWS::StackName}-CacheTable'

  AnalyticsTableName:
    Description: 'DynamoDB Analytics Table Name'
    Value: !Ref AnalyticsTable
    Export:
      Name: !Sub '${AWS::StackName}-AnalyticsTable'

  UsersTableName:
    Description: 'DynamoDB Users Table Name'
    Value: !Ref UsersTable
    Export:
      Name: !Sub '${AWS::StackName}-UsersTable'

  SubscriptionsTableName:
    Description: 'DynamoDB Subscriptions Table Name'
    Value: !Ref SubscriptionsTable
    Export:
      Name: !Sub '${AWS::StackName}-SubscriptionsTable'

  RateLimitTableName:
    Description: 'DynamoDB Rate Limit Table Name'
    Value: !Ref RateLimitTable
    Export:
      Name: !Sub '${AWS::StackName}-RateLimitTable'

  FunctionName:
    Description: 'Lambda Function Name'
    Value: !Ref SummarizeFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'